[package]
name = "szkdcm"
version = "0.1.2"
edition = "2024"
authors = ['Yuki SUZUKI']
repository = "https://github.com/ykszk/szkdcm"

[lib]
name = "szkdcm"
path = "src/lib.rs"

[[bin]]
name = "szkdcm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.49", features = ["derive"] }
clap_complete = "4.5.59"
csv = "1.4.0"
dicom-core = "0.9.0"
dicom-dictionary-std = "0.9.0"
dicom-dump = { version = "0.9.0", default-features = false, features = [] }
dicom-object = "0.9.0"
env_logger = "0.11.8"
log = "0.4.28"
rayon = "1.11.0"

[dev-dependencies]
dicom-test-files = "0.3.1"
insta = "1.43.2"
