[package]
name = "szkdcm"
version = "0.1.3"
edition = "2024"
authors = ['Yuki SUZUKI']
repository = "https://github.com/ykszk/szkdcm"

[lib]
name = "szkdcm"
path = "src/lib.rs"

[[bin]]
name = "szkdcm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
csv = "1.4.0"
dicom-core = "0.9.1"
dicom-dictionary-std = "0.9.0"
dicom-dump = { version = "0.9.1", default-features = false, features = [] }
dicom-object = "0.9.1"
env_logger = "0.11.10"
log = "0.4.29"
rayon = "1.12.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
dicom-test-files = "0.4.0"
insta = "1.47.2"
